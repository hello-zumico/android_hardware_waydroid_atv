name: Build patched hwcomposer.waydroid.so

on:
  push:
    branches: [lineage-20-live-resize]
    paths:
      - 'hwcomposer/**'
      - '.github/workflows/build-hwcomposer.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, linux, x64]
    env:
      PATH: /home/lorna/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

    steps:
      - name: Install build dependencies (once)
        run: |
          mkdir -p "$HOME/.local/bin"
          if ! command -v repo &>/dev/null; then
            curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo \
              -o "$HOME/.local/bin/repo"
            chmod +x "$HOME/.local/bin/repo"
          fi
          export PATH="$HOME/.local/bin:$PATH"
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git git-lfs gnupg gperf imagemagick lib32readline-dev lib32z1-dev \
            libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils \
            lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            lib32ncurses5-dev libncurses5 libncurses5-dev \
            python3-setuptools python3-mako python3-yaml 2>&1 | tail -5

      - name: Init AOSP source (skip if already done)
        run: |
          AOSP_DIR="$HOME/aosp-waydroid-atv"
          mkdir -p "$AOSP_DIR"
          cd "$AOSP_DIR"
          if [ ! -d ".repo" ]; then
            git config --global user.email "ci@localhost"
            git config --global user.name "CI"
            repo init -u https://github.com/LineageOS/android.git -b lineage-20.0 --git-lfs --depth=1
            wget -qO - https://raw.githubusercontent.com/WayDroid-ATV/android_vendor_waydroid/lineage-20/manifest_scripts/generate-manifest.sh | bash
          fi

      - name: Sync AOSP source
        run: |
          cd "$HOME/aosp-waydroid-atv"
          repo sync -j$(nproc) -c --no-clone-bundle --no-tags 2>&1 | tail -10

      - name: Overlay patched hardware/waydroid
        run: |
          rm -rf "$HOME/aosp-waydroid-atv/hardware/waydroid"
          git clone --depth=1 --branch lineage-20-live-resize \
            https://github.com/hello-zumico/android_hardware_waydroid_atv.git \
            "$HOME/aosp-waydroid-atv/hardware/waydroid"

      - name: Enable ccache
        run: |
          CCACHE_BIN=$(command -v ccache || true)
          if [ -n "$CCACHE_BIN" ]; then
            ccache -M 20G
            echo "USE_CCACHE=1" >> $GITHUB_ENV
            echo "CCACHE_EXEC=$CCACHE_BIN" >> $GITHUB_ENV
          else
            echo "ccache not found, skipping"
          fi

      - name: Build hwcomposer.waydroid
        run: |
          cd "$HOME/aosp-waydroid-atv"
          source build/envsetup.sh
          lunch lineage_gsi_tv_x86_64-userdebug
          m hwcomposer.waydroid -j$(nproc) 2>&1 | tail -50

      - name: Collect artifact
        run: |
          SO=$(find "$HOME/aosp-waydroid-atv/out" -name "hwcomposer.waydroid.so" | head -1)
          echo "Found: $SO"
          cp "$SO" /tmp/hwcomposer.waydroid.so

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hwcomposer-waydroid-live-resize
          path: /tmp/hwcomposer.waydroid.so
          retention-days: 90

      - name: Create/update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: live-resize-latest
          name: "Patched hwcomposer (live resize)"
          body: |
            Patched `hwcomposer.waydroid.so` with live resize support.

            Built from branch `lineage-20-live-resize`.

            **Install:**
            ```bash
            curl -fsSL https://github.com/hello-zumico/android_hardware_waydroid_atv/releases/download/live-resize-latest/hwcomposer.waydroid.so \
              | sudo tee /var/lib/waydroid/rootfs/vendor/lib64/hw/hwcomposer.waydroid.so > /dev/null
            sudo systemctl restart waydroid-container.service
            ```
          files: /tmp/hwcomposer.waydroid.so
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
